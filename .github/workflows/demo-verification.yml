name: Synthetic Demo Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-pm-harness v2 - gpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-pm-harness v2 - gpt/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify synthetic anonymization and validator
        run: python -m scripts.verify_demo
